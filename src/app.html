<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Fast, peer-to-peer, end-to-end encrypted file transfer directly in your browser with WebRTC." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
		<script>
			(function() {
				try {
					var saved = localStorage.getItem('laki_theme');
					if (saved === 'light') {
						document.documentElement.classList.remove('dark');
						document.documentElement.classList.add('light');
					} else {
						document.documentElement.classList.remove('light');
						document.documentElement.classList.add('dark');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body class="min-h-screen antialiased font-sans transition-colors duration-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
